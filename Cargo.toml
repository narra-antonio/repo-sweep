[package]
name = "repo-sweep"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Keep many local git repositories in sync with their remotes and clean up branches deleted after merge"
license = "MIT"
repository = "https://github.com/narra-antonio/repo-sweep"
readme = "README.md"
keywords = ["git", "cli", "repositories", "sync", "branches"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
